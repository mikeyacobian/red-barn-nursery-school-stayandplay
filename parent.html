  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;

  height: auto;

#widget &gt; svg {
  width: 100%;

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {

  &lt;/style&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;rb-calendar-booking&#x27;);
      const childList = root.querySelector(&#x27;#rb-child-list&#x27;);
      const childCount = root.querySelector(&#x27;#rb-child-count&#x27;);
      const addChildButton = root.querySelector(&#x27;#rb-add-child&#x27;);
      const targets = root.querySelector(&#x27;#rb-targets&#x27;);
      const calendar = root.querySelector(&#x27;#rb-calendar&#x27;);
      const status = root.querySelector(&#x27;#rb-status&#x27;);
      const summaryLine = root.querySelector(&#x27;#rb-summary-line&#x27;);
      const summaryPrice = root.querySelector(&#x27;#rb-summary-price&#x27;);
      const selectedDays = root.querySelector(&#x27;#rb-selected-days&#x27;);
      const reviewButton = root.querySelector(&#x27;#rb-review-button&#x27;);
      const backdrop = root.querySelector(&#x27;#rb-review-backdrop&#x27;);
      const closeReview = root.querySelector(&#x27;#rb-close-review&#x27;);
      const reviewFamily = root.querySelector(&#x27;#rb-review-family&#x27;);
      const reviewList = root.querySelector(&#x27;#rb-review-list&#x27;);
      const reviewTotal = root.querySelector(&#x27;#rb-review-total&#x27;);
      const parentName = root.querySelector(&#x27;#rb-parent-name&#x27;);
      const parentEmail = root.querySelector(&#x27;#rb-parent-email&#x27;);
      const previousMonth = root.querySelector(&#x27;#rb-previous-month&#x27;);
      const nextMonth = root.querySelector(&#x27;#rb-next-month&#x27;);
      const monthLabel = root.querySelector(&#x27;#rb-month-label&#x27;);
      const liveStatus = root.querySelector(&#x27;#rb-live-status&#x27;);
      const sessionDetails = root.querySelector(&#x27;#rb-session-details&#x27;);
      const confirmBooking = root.querySelector(&#x27;#rb-confirm-booking&#x27;);
      const confirmStatus = root.querySelector(&#x27;#rb-confirm-status&#x27;);

      const childColors = [&#x27;#e61717&#x27;, &#x27;#2563eb&#x27;, &#x27;#9a5d00&#x27;, &#x27;#247a45&#x27;, &#x27;#7c3aed&#x27;, &#x27;#087f8c&#x27;];

      let children = [{ id: &#x27;child-1&#x27;, name: &#x27;&#x27; }];
      let activeTarget = &#x27;all&#x27;;
      let nextChildNumber = 2;
      let backendReady = false;
      let currentMonthIndex = 0;
      let monthKeys = [&#x27;2026-09&#x27;];

      const fallbackDayData = [
        null,
        { date: &#x27;2026-09-01&#x27;, day: 1, unavailable: &#x27;Session not open&#x27; },
        { date: &#x27;2026-09-02&#x27;, day: 2, unavailable: &#x27;Session not open&#x27; },
        { date: &#x27;2026-09-03&#x27;, day: 3, unavailable: &#x27;Session not open&#x27; },
        { date: &#x27;2026-09-04&#x27;, day: 4, unavailable: &#x27;Session not open&#x27; },
        { date: &#x27;2026-09-07&#x27;, day: 7, unavailable: &#x27;Session not open&#x27; },
        { date: &#x27;2026-09-08&#x27;, day: 8, unavailable: &#x27;Session not open&#x27; },
        { date: &#x27;2026-09-09&#x27;, day: 9, unavailable: &#x27;Session not open&#x27; },
        { date: &#x27;2026-09-10&#x27;, day: 10, unavailable: &#x27;Session not open&#x27; },
        { date: &#x27;2026-09-11&#x27;, day: 11, unavailable: &#x27;Session not open&#x27; },
        { date: &#x27;2026-09-14&#x27;, day: 14, spots: 9 },
        { date: &#x27;2026-09-15&#x27;, day: 15, spots: 0 },
        { date: &#x27;2026-09-16&#x27;, day: 16, spots: 4 },
        { date: &#x27;2026-09-17&#x27;, day: 17, spots: 12 },
        { date: &#x27;2026-09-18&#x27;, day: 18, spots: 2 },
        { date: &#x27;2026-09-21&#x27;, day: 21, spots: 7 },
        { date: &#x27;2026-09-22&#x27;, day: 22, spots: 1 },
        { date: &#x27;2026-09-23&#x27;, day: 23, unavailable: &#x27;School closed&#x27; },
        { date: &#x27;2026-09-24&#x27;, day: 24, spots: 10 },
        { date: &#x27;2026-09-25&#x27;, day: 25, spots: 6 },
        { date: &#x27;2026-09-28&#x27;, day: 28, spots: 14 },
        { date: &#x27;2026-09-29&#x27;, day: 29, spots: 3 },
        { date: &#x27;2026-09-30&#x27;, day: 30, spots: 8 },
        null,
        null
      ];

      let allDays = fallbackDayData.filter(Boolean);
      let dayData = fallbackDayData;
      const assignments = new Map();

      function namedChildren() {
        return children.filter(child =&gt; child.name.trim());
      }

      function childName(id) {
        return children.find(child =&gt; child.id === id)?.name.trim() || &#x27;Unnamed child&#x27;;
      }

      function childColor(id) {
        const number = Number(id.split(&#x27;-&#x27;)[1]) || 1;
        return childColors[(number - 1) % childColors.length];
      }

      function childInitial(id) {
        return childName(id).charAt(0).toUpperCase() || &#x27;?&#x27;;
      }

      function shortName(child) {
        return child.name.trim().split(/\s+/)[0] || `Child ${children.indexOf(child) + 1}`;
      }

      function formatDate(dateString) {
        return new Intl.DateTimeFormat(&#x27;en-US&#x27;, { weekday: &#x27;short&#x27;, month: &#x27;short&#x27;, day: &#x27;numeric&#x27;, timeZone: &#x27;UTC&#x27; }).format(new Date(`${dateString}T12:00:00Z`));
      }

      function availabilityText(day) {
        if (day.unavailable) return day.unavailable;
        if (day.spots === 0) return &#x27;Full&#x27;;
        if (day.spots === 1) return &#x27;Only 1 left&#x27;;
        if (day.spots &lt;= 3) return `Only ${day.spots} left`;
        return `${day.spots} open`;
      }

      function monthGrid(monthKey) {
        const [year, month] = monthKey.split(&#x27;-&#x27;).map(Number);
        const byDate = new Map(allDays.map(day =&gt; [day.date, day]));
        const result = [];
        const first = new Date(Date.UTC(year, month - 1, 1, 12));
        const rawOffset = (first.getUTCDay() + 6) % 7;
        const offset = rawOffset &gt; 4 ? 0 : rawOffset;
        for (let index = 0; index &lt; offset; index += 1) result.push(null);
        const finalDay = new Date(Date.UTC(year, month, 0, 12)).getUTCDate();
        for (let number = 1; number &lt;= finalDay; number += 1) {
          const date = new Date(Date.UTC(year, month - 1, number, 12));
          if (date.getUTCDay() === 0 || date.getUTCDay() === 6) continue;
          const key = `${year}-${String(month).padStart(2, &#x27;0&#x27;)}-${String(number).padStart(2, &#x27;0&#x27;)}`;
          result.push(byDate.get(key) || { date: key, day: number, unavailable: &#x27;Session not open&#x27; });
        }
        while (result.length % 5) result.push(null);
        return result;
      }

      function updateMonth() {
        const monthKey = monthKeys[currentMonthIndex] || monthKeys[0];
        dayData = monthGrid(monthKey);
        const [year, month] = monthKey.split(&#x27;-&#x27;).map(Number);
        monthLabel.textContent = new Intl.DateTimeFormat(&#x27;en-US&#x27;, { month: &#x27;long&#x27;, year: &#x27;numeric&#x27;, timeZone: &#x27;UTC&#x27; }).format(new Date(Date.UTC(year, month - 1, 1, 12)));
        previousMonth.disabled = currentMonthIndex === 0;
        nextMonth.disabled = currentMonthIndex &gt;= monthKeys.length - 1;

        const currentDays = allDays.filter(day =&gt; day.date.startsWith(monthKey));
        const sessionName = currentDays.find(day =&gt; day.sessionName)?.sessionName;
        if (sessionName) {
          const sessionDays = allDays.filter(day =&gt; day.sessionName === sessionName);
          const first = sessionDays[0];
          const last = sessionDays[sessionDays.length - 1];
          sessionDetails.textContent = `${formatDate(first.date).replace(/^\w+, /, &#x27;&#x27;)}–${formatDate(last.date).replace(/^\w+, /, &#x27;&#x27;)} · ${first.startTimeLabel || &#x27;Noon&#x27;}–${first.endTimeLabel || &#x27;2:00 PM&#x27;}`;
        }
        buildCalendar();
      }

      function timeLabel(value) {
        if (!value) return &#x27;&#x27;;
        const [hour, minute] = value.split(&#x27;:&#x27;).map(Number);
        return new Intl.DateTimeFormat(&#x27;en-US&#x27;, { hour: &#x27;numeric&#x27;, minute: &#x27;2-digit&#x27; }).format(new Date(2026, 0, 1, hour, minute));
      }

      async function loadAvailability() {
        try {
          const response = await fetch(&#x27;/api/availability&#x27;, { cache: &#x27;no-store&#x27; });
          if (!response.ok) throw new Error(&#x27;Availability could not be loaded.&#x27;);
          const result = await response.json();
          allDays = result.days.map(day =&gt; {
            const bookingDeadline = new Date(day.booking_deadline);
            const unavailable = day.closure_note || (!day.booking_enabled
              ? (bookingDeadline &lt; new Date() ? &#x27;Booking closed&#x27; : &#x27;Booking not open&#x27;)
              : &#x27;&#x27;);
            return {
              date: day.service_date,
              day: Number(day.service_date.slice(-2)),
              spots: Number(day.open_count),
              unavailable,
              sessionName: day.session_name,
              startTimeLabel: timeLabel(day.start_time),
              endTimeLabel: timeLabel(day.end_time)
            };
          });
          monthKeys = [...new Set(allDays.map(day =&gt; day.date.slice(0, 7)))].sort();
          const firstOpenMonth = monthKeys.findIndex(key =&gt; allDays.some(day =&gt; day.date.startsWith(key) &amp;&amp; !day.unavailable));
          currentMonthIndex = Math.max(0, firstOpenMonth);
          backendReady = true;
          liveStatus.innerHTML = &#x27;&lt;i aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Live availability&#x27;;
          updateMonth();
        } catch (error) {
          backendReady = false;
          liveStatus.innerHTML = &#x27;&lt;i aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Preview availability&#x27;;
          status.textContent = &#x27;The live booking service is not connected yet. You can still explore this preview.&#x27;;
        }
      }

      function priceForCount(count) {
        return count === 1 ? 50 : count &gt; 1 ? 75 : 0;
      }

      function renderChildren() {
        childList.innerHTML = &#x27;&#x27;;
        children.forEach((child, index) =&gt; {
          const row = document.createElement(&#x27;div&#x27;);
          row.className = &#x27;rb-child-row&#x27;;

          const number = document.createElement(&#x27;span&#x27;);
          number.className = &#x27;rb-child-number&#x27;;
          number.textContent = String(index + 1);
          number.style.setProperty(&#x27;--child-color&#x27;, childColor(child.id));
          number.setAttribute(&#x27;aria-label&#x27;, `${shortName(child)} color marker`);

          const input = document.createElement(&#x27;input&#x27;);
          input.type = &#x27;text&#x27;;
          input.value = child.name;
          input.setAttribute(&#x27;aria-label&#x27;, `Child ${index + 1} full name`);
          input.placeholder = `Child ${index + 1} full name`;
          input.addEventListener(&#x27;input&#x27;, event =&gt; {
            child.name = event.target.value;
            renderTargets();
            updateCalendar();
            updateSummary();
          });

          const remove = document.createElement(&#x27;button&#x27;);
          remove.type = &#x27;button&#x27;;
          remove.className = &#x27;rb-remove-child&#x27;;
          remove.textContent = &#x27;×&#x27;;
          remove.disabled = children.length === 1;
          remove.setAttribute(&#x27;aria-label&#x27;, `Remove child ${index + 1}`);
          remove.addEventListener(&#x27;click&#x27;, () =&gt; removeChild(child.id));

          row.append(number, input, remove);
          childList.append(row);
        });
        childCount.textContent = String(namedChildren().length);
        addChildButton.disabled = children.length &gt;= 6;
      }

      function addChild() {
        const id = `child-${nextChildNumber++}`;
        children.push({ id, name: &#x27;&#x27; });
        renderChildren();
        renderTargets();
        updateCalendar();
        const inputs = childList.querySelectorAll(&#x27;input&#x27;);
        inputs[inputs.length - 1].focus();
        status.textContent = &#x27;New child added. Enter their name, then choose dates for them.&#x27;;
      }

      function removeChild(id) {
        children = children.filter(child =&gt; child.id !== id);
        assignments.forEach(set =&gt; set.delete(id));
        if (activeTarget === id) activeTarget = &#x27;all&#x27;;
        renderChildren();
        renderTargets();
        updateCalendar();
        updateSummary();
      }

      function renderTargets() {
        targets.innerHTML = &#x27;&#x27;;
        const availableChildren = namedChildren();
        const options = [{ id: &#x27;all&#x27;, label: `Everyone (${availableChildren.length})` }, ...availableChildren.map(child =&gt; ({ id: child.id, label: shortName(child) }))];
        if (!options.some(option =&gt; option.id === activeTarget)) activeTarget = &#x27;all&#x27;;

        options.forEach(option =&gt; {
          const button = document.createElement(&#x27;button&#x27;);
          button.type = &#x27;button&#x27;;
          button.className = `rb-target ${option.id === &#x27;all&#x27; ? &#x27;rb-target-all&#x27; : &#x27;rb-target-child&#x27;}`;
          if (option.id !== &#x27;all&#x27;) button.style.setProperty(&#x27;--child-color&#x27;, childColor(option.id));
          button.textContent = option.label;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(activeTarget === option.id));
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            activeTarget = option.id;
            renderTargets();
            updateCalendar();
            status.textContent = activeTarget === &#x27;all&#x27;
              ? `Everyone is selected. Calendar changes apply to all ${availableChildren.length} children.`
              : `${childName(activeTarget)} is selected. Calendar changes apply only to this child.`;
          });
          targets.append(button);
        });
      }

      function targetIds() {
        return activeTarget === &#x27;all&#x27; ? namedChildren().map(child =&gt; child.id) : [activeTarget];
      }

      function canAddTargets(day, assigned, ids) {
        const missing = ids.filter(id =&gt; !assigned.has(id));
        return assigned.size + missing.length &lt;= day.spots;
      }

      function toggleDate(day) {
        const ids = targetIds();
        if (!ids.length) {
          status.textContent = &#x27;Add at least one child before selecting dates.&#x27;;
          return;
        }
        const assigned = assignments.get(day.date) || new Set();
        const allAssigned = ids.every(id =&gt; assigned.has(id));

        if (allAssigned) {
          ids.forEach(id =&gt; assigned.delete(id));
          status.textContent = `${ids.length === 1 ? childName(ids[0]) : &#x27;Everyone&#x27;} removed from ${formatDate(day.date)}.`;
        } else if (canAddTargets(day, assigned, ids)) {
          ids.forEach(id =&gt; assigned.add(id));
          status.textContent = `${ids.length === 1 ? childName(ids[0]) : &#x27;Everyone&#x27;} added to ${formatDate(day.date)}.`;
        } else {
          status.textContent = `${formatDate(day.date)} does not have enough spots for that selection.`;
          return;
        }

        if (assigned.size) assignments.set(day.date, assigned);
        else assignments.delete(day.date);
        updateCalendar();
        updateSummary();
      }

      function buildCalendar() {
        calendar.innerHTML = &#x27;&#x27;;
        dayData.forEach(day =&gt; {
          if (!day) {
            const blank = document.createElement(&#x27;span&#x27;);
            blank.className = &#x27;rb-day rb-blank&#x27;;
            blank.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
            calendar.append(blank);
            return;
          }

          const button = document.createElement(&#x27;button&#x27;);
          button.type = &#x27;button&#x27;;
          button.className = &#x27;rb-day&#x27;;
          button.dataset.date = day.date;
          button.innerHTML = `
            &lt;span class=&quot;rb-day-top&quot;&gt;&lt;strong class=&quot;rb-day-number&quot;&gt;${day.day}&lt;/strong&gt;&lt;span class=&quot;rb-family-badges&quot; hidden&gt;&lt;/span&gt;&lt;/span&gt;
            &lt;span class=&quot;rb-spot-label&quot;&gt;${availabilityText(day)}&lt;/span&gt;
            &lt;span class=&quot;rb-mini-map&quot;&gt;&lt;/span&gt;
          `;
          if (day.unavailable || day.spots === 0) button.disabled = true;
          if (!day.unavailable) {
            const map = button.querySelector(&#x27;.rb-mini-map&#x27;);
            const booked = 14 - day.spots;
            map.setAttribute(&#x27;role&#x27;, &#x27;img&#x27;);
            map.setAttribute(&#x27;aria-label&#x27;, `${booked} booked and ${day.spots} open out of 14 spots`);
            map.innerHTML = Array.from({ length: 14 }, (_, index) =&gt; `&lt;i class=&quot;rb-dot ${index &lt; booked ? &#x27;rb-dot-booked&#x27; : &#x27;rb-dot-open&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`).join(&#x27;&#x27;);
          }
          button.addEventListener(&#x27;click&#x27;, () =&gt; toggleDate(day));
          calendar.append(button);
        });
        updateCalendar();
      }

      function updateCalendar() {
        const ids = targetIds();
        dayData.filter(Boolean).forEach(day =&gt; {
          const button = calendar.querySelector(`[data-date=&quot;${day.date}&quot;]`);
          if (!button) return;
          const assigned = assignments.get(day.date) || new Set();
          [...assigned].forEach(id =&gt; {
            if (!children.some(child =&gt; child.id === id)) assigned.delete(id);
          });
          const allTargetAssigned = ids.length &gt; 0 &amp;&amp; ids.every(id =&gt; assigned.has(id));
          const canAdd = !day.unavailable &amp;&amp; day.spots &gt; 0 &amp;&amp; canAddTargets(day, assigned, ids);
          button.classList.toggle(&#x27;has-family&#x27;, assigned.size &gt; 0);
          button.classList.toggle(&#x27;is-active-child&#x27;, allTargetAssigned);
          button.classList.toggle(&#x27;is-low&#x27;, !day.unavailable &amp;&amp; day.spots &gt; 0 &amp;&amp; day.spots &lt;= 3);
          button.disabled = Boolean(day.unavailable) || day.spots === 0 || (!allTargetAssigned &amp;&amp; !canAdd);
          button.style.setProperty(&#x27;--active-child-color&#x27;, activeTarget === &#x27;all&#x27; ? &#x27;#111111&#x27; : childColor(activeTarget));

          const names = [...assigned].map(childName);
          const badges = button.querySelector(&#x27;.rb-family-badges&#x27;);
          badges.hidden = assigned.size === 0;
          badges.setAttribute(&#x27;aria-label&#x27;, names.length ? `Scheduled: ${names.join(&#x27; and &#x27;)}` : &#x27;&#x27;);
          badges.replaceChildren(...[...assigned].map(id =&gt; {
            const marker = document.createElement(&#x27;i&#x27;);
            marker.className = &#x27;rb-child-badge&#x27;;
            marker.style.setProperty(&#x27;--child-color&#x27;, childColor(id));
            marker.title = childName(id);
            marker.textContent = childInitial(id);
            marker.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
            return marker;
          }));
          button.setAttribute(&#x27;aria-label&#x27;, `${formatDate(day.date)}, ${availabilityText(day)}${names.length ? `, selected for ${names.join(&#x27; and &#x27;)}` : &#x27;&#x27;}`);
          button.setAttribute(&#x27;aria-pressed&#x27;, String(allTargetAssigned));
        });
      }

      function bookedDates() {
        return [...assignments.entries()].filter(([, set]) =&gt; set.size).sort(([a], [b]) =&gt; a.localeCompare(b));
      }

      function updateSummary() {
        const dates = bookedDates();
        const childSpots = dates.reduce((sum, [, set]) =&gt; sum + set.size, 0);
        const total = dates.reduce((sum, [, set]) =&gt; sum + priceForCount(set.size), 0);
        summaryLine.textContent = `${childSpots} child-${childSpots === 1 ? &#x27;spot&#x27; : &#x27;spots&#x27;} across ${dates.length} ${dates.length === 1 ? &#x27;date&#x27; : &#x27;dates&#x27;}`;
        summaryPrice.textContent = dates.length ? `$${total} added to your school bill` : &#x27;Choose at least one date&#x27;;
        reviewButton.disabled = !dates.length || !namedChildren().length || !parentName.value.trim() || !parentEmail.validity.valid;

        selectedDays.innerHTML = &#x27;&#x27;;
        dates.forEach(([date, set]) =&gt; {
          const item = document.createElement(&#x27;span&#x27;);
          item.className = &#x27;rb-selected-day&#x27;;
          item.textContent = `${formatDate(date).replace(&#x27;,&#x27;, &#x27;&#x27;)} · ${[...set].map(id =&gt; shortName(children.find(child =&gt; child.id === id))).join(&#x27; + &#x27;)}`;
          selectedDays.append(item);
        });
      }

      function openReview() {
        const dates = bookedDates();
        const total = dates.reduce((sum, [, set]) =&gt; sum + priceForCount(set.size), 0);
        reviewFamily.textContent = `${parentName.value.trim()} · ${parentEmail.value.trim()}`;
        reviewList.innerHTML = &#x27;&#x27;;
        dates.forEach(([date, set]) =&gt; {
          const row = document.createElement(&#x27;div&#x27;);
          row.className = &#x27;rb-review-row&#x27;;
          const details = document.createElement(&#x27;span&#x27;);
          details.textContent = `${formatDate(date)} · Noon–2:00 PM · ${[...set].map(childName).join(&#x27; and &#x27;)}`;
          const price = document.createElement(&#x27;strong&#x27;);
          price.textContent = `$${priceForCount(set.size)}`;
          row.append(details, price);
          reviewList.append(row);
        });
        reviewTotal.textContent = `$${total}`;
        confirmStatus.textContent = &#x27;&#x27;;
        confirmBooking.disabled = false;
        confirmBooking.textContent = &#x27;Confirm reservation&#x27;;
        backdrop.hidden = false;
        closeReview.focus();
      }

      async function submitBooking() {
        const bookingChildren = namedChildren().map(child =&gt; ({ client_id: child.id, full_name: child.name.trim() }));
        const selections = bookedDates().flatMap(([serviceDate, set]) =&gt; [...set].map(childId =&gt; ({ service_date: serviceDate, client_id: childId })));
        confirmBooking.disabled = true;
        confirmBooking.textContent = &#x27;Checking availability…&#x27;;
        confirmStatus.textContent = &#x27;&#x27;;
        try {
          const response = await fetch(&#x27;/api/bookings&#x27;, {
            method: &#x27;POST&#x27;,
            headers: { &#x27;content-type&#x27;: &#x27;application/json&#x27; },
            body: JSON.stringify({ parentName: parentName.value.trim(), email: parentEmail.value.trim(), children: bookingChildren, selections })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || &#x27;The booking could not be completed.&#x27;);
          confirmBooking.textContent = &#x27;Reservation confirmed&#x27;;
          confirmStatus.textContent = result.emailSent
            ? `Confirmation ${result.confirmationCode} was emailed to you.`
            : `Confirmation ${result.confirmationCode} is saved. The school can resend the email if needed.`;
          await loadAvailability();
        } catch (error) {
          confirmBooking.disabled = false;
          confirmBooking.textContent = &#x27;Try again&#x27;;
          confirmStatus.textContent = error.message;
        }
      }

      addChildButton.addEventListener(&#x27;click&#x27;, addChild);
      [parentName, parentEmail].forEach(input =&gt; input.addEventListener(&#x27;input&#x27;, updateSummary));
      reviewButton.addEventListener(&#x27;click&#x27;, openReview);
      confirmBooking.addEventListener(&#x27;click&#x27;, submitBooking);
      previousMonth.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (currentMonthIndex &gt; 0) { currentMonthIndex -= 1; updateMonth(); }
      });
      nextMonth.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (currentMonthIndex &lt; monthKeys.length - 1) { currentMonthIndex += 1; updateMonth(); }
      });
      closeReview.addEventListener(&#x27;click&#x27;, () =&gt; {
        backdrop.hidden = true;
        reviewButton.focus();
      });
      backdrop.addEventListener(&#x27;click&#x27;, event =&gt; {
        if (event.target === backdrop) closeReview.click();
      });

      renderChildren();
      renderTargets();
      buildCalendar();
      updateSummary();
      loadAvailability();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {

    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
